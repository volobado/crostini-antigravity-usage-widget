[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lagrange-agy"
version = "1.2.2"
description = "Lagrange - Gemini CLI (agy) Usage: live quota, token and context meter, and account switcher, for Antigravity CLI (agy)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Volo Bado" }]
keywords = ["antigravity", "antigravity-cli", "agy", "gemini", "gemini-cli",
            "quota", "usage", "tokens", "context", "widget", "cli", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
# No third-party dependencies on purpose: a status widget that breaks because
# of someone else's release is not doing its job.
dependencies = []

[project.urls]
Homepage = "https://github.com/Vovka666/antigravity-gemini-usage-widget"
Issues = "https://github.com/Vovka666/antigravity-gemini-usage-widget/issues"

[project.scripts]
lagrange = "lagrange.__main__:main"

[project.gui-scripts]
lagrange-widget = "lagrange.ui:main"

[tool.setuptools]
packages = ["lagrange"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Broad excepts are deliberate in the worker thread and in discovery: a
    # status widget must degrade, not disappear.
    "BLE001",
]
